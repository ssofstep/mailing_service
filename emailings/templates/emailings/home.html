{% extends 'emailings/base.html' %}


{% block content %}
<div class="container">
    <div class="row text-center">
        {% for email in object_list %}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ email.theme }}</h4>
                </div>
                <div class="card-body">
                    <a href="{% url 'emailings:message_list' %}" class="btn btn-primary">Перейти</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
